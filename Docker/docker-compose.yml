version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workbench
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgresql://postgres:postgres@db:5432/workbench
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "10"
      DB_POOL_TIMEOUT: "5.0"
    volumes:
      - ../ssw-flask/sql:/srv/app/sql:ro
    command: ["gunicorn", "app:create_app()", "--bind", "0.0.0.0:8000"]
    ports:
      - "8000:8000"

volumes:
  db-data:
